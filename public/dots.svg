<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- The dot grid: change width/height for spacing, r for dot size -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.8" fill="#64748b"/>
    </pattern>

    <!-- Radial fade: white = fully visible, black = hidden -->
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.7"  stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <mask id="mask">
      <rect width="100%" height="100%" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="url(#dots)" mask="url(#mask)"/>
</svg>